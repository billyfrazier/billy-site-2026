<script type="module">
import * as THREE from 'three';

const q = new URLSearchParams(location.search);
const R_ARM = +(q.get('r') ?? 0.075);        // farther than this from the arm's axis…
const X_IN = +(q.get('xin') ?? 0.20);        // …and inside this |x| (the torso column) → not arm

  for (const [k, ty] of Object.entries(torsoY)) { const d = Math.abs(y - ty); if (d < bd) { bd = d; best = k; } }
  return torso[best];
};

const segDist = (p, a, b) => {
  const ab = b.clone().sub(a), t = Math.max(0, Math.min(1, p.clone().sub(a).dot(ab) / ab.lengthSq()));
  return p.distanceTo(a.clone().addScaledVector(ab, t));

const P = new THREE.Vector3();
let moved = 0, movedWeight = 0;

  const j = [0, 1, 2, 3].map((k) => J.getComponent(i, k));
  const w = [0, 1, 2, 3].map((k) => W.getComponent(i, k));

    const f = smooth((d - R_ARM) / BAND) * smooth((X_IN - Math.abs(P.x)) / BAND);
    if (f < 0.001) continue;

    for (let k = 0; k < 4; k++) if (side.arm.includes(j[k])) { give += w[k] * f; w[k] *= (1 - f); }

  boneNames: bones.map((b) => b.name) };

</script>
